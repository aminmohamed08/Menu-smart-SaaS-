<!DOCTYPE html>
<html lang="fr" class="bg-slate-900" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Menu Digital</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors: { brand: { 50:'#fff1f2', 100:'#ffe4e6', 500:'#f43f5e', 600:'#e11d48', 700:'#be123c' } },
  fontFamily: { sans: ['Plus Jakarta Sans','Cairo','sans-serif'] }
} } }
</script>
<style>
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.glass-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); }
html[lang="ar"] body { font-family: 'Cairo','Plus Jakarta Sans',sans-serif; }
#categoryChips { -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
#categoryChips.dragging { cursor: grabbing; }
@media (max-width: 639px) { body, .app-frame { min-height: 100dvh; } }
#appLoader { transition: opacity .4s cubic-bezier(0.16, 1, 0.3, 1); }
#appLoader.is-leaving { opacity: 0; pointer-events: none; }
.loader-ring { animation: loaderSpin .9s cubic-bezier(0.5, 0.15, 0.5, 0.85) infinite; will-change: transform; }
.loader-core { animation: loaderPulse 1.4s cubic-bezier(0.45, 0, 0.55, 1) infinite; will-change: transform, opacity; }
@keyframes loaderSpin { to { transform: rotate(360deg); } }
@keyframes loaderPulse { 0%, 100% { transform: scale(.9); opacity: .65; } 50% { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .loader-ring, .loader-core { animation: none; } }
</style>
</head>
<body class="w-full min-h-screen bg-slate-900 text-slate-800 font-sans antialiased sm:flex sm:justify-center sm:items-center sm:p-4">

<div id="appLoader" class="fixed inset-0 z-[70] bg-slate-900 flex items-center justify-center" role="status" aria-live="polite">
  <div class="relative w-16 h-16">
    <div class="loader-ring absolute inset-0 rounded-full border-4 border-slate-700 border-t-brand-500"></div>
    <div class="loader-core absolute inset-0 flex items-center justify-center text-amber-400 text-xl"><i class="fa-solid fa-utensils"></i></div>
  </div>
</div>

<!-- Fatal overlay: only for unknown restaurant / invalid QR / load failure (NOT for suspension) -->
<div id="fatalError" class="hidden fixed inset-0 z-[60] bg-slate-900 flex items-center justify-center p-6 text-center text-white">
  <div class="space-y-3 max-w-xs">
    <div class="w-16 h-16 mx-auto rounded-full bg-slate-800 flex items-center justify-center text-amber-400 text-2xl"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <p id="fatalMsg" class="font-bold text-sm leading-relaxed"></p>
  </div>
</div>

<div class="app-frame w-full min-h-screen sm:min-h-0 sm:max-w-md sm:h-[min(900px,calc(100dvh-2rem))] bg-slate-50 sm:rounded-[38px] sm:shadow-2xl flex flex-col relative sm:overflow-hidden sm:border-4 border-slate-800/20">

  <div class="sticky top-0 z-30 sm:static flex-shrink-0">
  <header class="bg-slate-900 text-white px-4 sm:px-5 pt-[max(1rem,env(safe-area-inset-top))] pb-4 shadow-md">
    <div class="flex justify-between items-center mb-3 gap-2">
      <div class="flex items-center space-x-3 rtl:space-x-reverse min-w-0">
        <div class="w-10 h-10 shrink-0 rounded-2xl bg-gradient-to-tr from-brand-600 to-amber-500 flex items-center justify-center text-white shadow-lg text-xl overflow-hidden">
          <img id="brandLogo" alt="" class="hidden w-full h-full object-cover">
          <i id="brandIcon" class="fa-solid fa-utensils"></i>
        </div>
        <div class="min-w-0">
          <h1 id="brandName" class="text-lg font-bold tracking-tight leading-tight truncate">…</h1>
          <p class="text-xs text-slate-400 flex items-center gap-1 truncate">
            <span id="openDot" class="w-2 h-2 shrink-0 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
            <span data-i18n="tableLabel">Table</span> <span id="currentTableDisplay" class="font-bold text-amber-400">--</span>
            <i id="tableLockIcon" class="hidden fa-solid fa-lock text-[9px] text-slate-500"></i>
          </p>
        </div>
      </div>
      <button onclick="toggleLanguage()" class="shrink-0 px-3 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 border border-slate-700 rounded-xl transition flex items-center gap-1.5 whitespace-nowrap">
        <i class="fa-solid fa-globe text-amber-400"></i>
        <span id="langBtnText">العربية</span>
      </button>
    </div>
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 rtl:left-auto rtl:right-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
      <input type="text" id="searchInput" oninput="filterMenu()" data-i18n-ph="searchPlaceholder"
        class="w-full bg-slate-800/80 text-sm text-white placeholder-slate-400 pl-10 pr-9 rtl:pr-10 rtl:pl-9 py-2.5 rounded-2xl focus:outline-none focus:ring-2 focus:ring-brand-500 border border-slate-700/60 transition">
      <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 rtl:right-auto rtl:left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
        <i class="fa-solid fa-circle-xmark text-sm"></i>
      </button>
    </div>
  </header>
  <nav id="categoryChips" class="bg-slate-900 border-b border-slate-800 py-3 px-4 flex flex-nowrap items-center gap-2 overflow-x-auto overflow-y-hidden whitespace-nowrap no-scrollbar select-none cursor-grab"></nav>
  </div>

  <main class="flex-1 sm:min-h-0 sm:overflow-y-auto p-4 space-y-6 pb-28 no-scrollbar">

    <!-- Closed / not accepting new orders notice -->
    <div id="closedBanner" class="hidden bg-slate-900 text-white rounded-2xl p-4 shadow-lg flex items-start gap-3" role="status">
      <div class="w-10 h-10 shrink-0 rounded-xl bg-red-500/20 text-red-400 flex items-center justify-center text-xl"><i class="fa-solid fa-store-slash"></i></div>
      <div class="min-w-0">
        <div class="font-bold text-sm" data-i18n="closedTitle"></div>
        <p class="text-xs text-slate-300 mt-1 leading-relaxed" data-i18n="closedMsg"></p>
      </div>
    </div>

    <!-- Live order banner (works even while the restaurant is closed) -->
    <div id="activeOrderBanner" class="hidden bg-gradient-to-r from-amber-500 to-amber-600 text-white rounded-2xl p-4 shadow-lg flex items-center justify-between">
      <div class="flex items-center space-x-3 rtl:space-x-reverse">
        <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-xl"><i id="bannerStatusIcon" class="fa-solid fa-clock"></i></div>
        <div>
          <div class="text-xs font-semibold uppercase tracking-wider text-amber-100" data-i18n="activeOrder">Active Order</div>
          <div class="font-bold text-sm" id="activeOrderStatusText">--</div>
        </div>
      </div>
      <button onclick="openOrderStatusModal()" class="bg-white text-slate-900 px-3 py-1.5 rounded-xl text-xs font-bold shadow hover:bg-amber-50 transition" data-i18n="viewBtn">View</button>
    </div>

    <div id="promoBanner" class="hidden relative rounded-2xl overflow-hidden h-36 shadow-lg bg-slate-800">
      <img id="promoImg" alt="" class="w-full h-full object-cover opacity-60">
      <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent p-4 flex flex-col justify-end">
        <span id="promoTag" class="bg-brand-600 text-white text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-md w-max tracking-wide mb-1"></span>
        <h2 id="promoTitle" class="text-white text-lg font-bold leading-tight"></h2>
        <p id="promoSub" class="text-slate-300 text-xs mt-0.5"></p>
      </div>
    </div>

    <div id="menuItemsContainer" class="space-y-6"></div>
  </main>

  <div id="cartBar" class="fixed sm:absolute bottom-0 inset-x-0 px-4 pt-6 pb-[max(1rem,env(safe-area-inset-bottom))] bg-gradient-to-t from-slate-900 via-slate-900/90 to-transparent z-20 pointer-events-none">
    <button onclick="openCartModal()" class="pointer-events-auto w-full bg-gradient-to-r from-brand-600 to-rose-600 hover:from-brand-700 hover:to-rose-700 text-white p-3.5 rounded-2xl shadow-xl shadow-brand-600/30 flex items-center justify-between transition-all active:scale-95 border border-white/10">
      <div class="flex items-center space-x-3 rtl:space-x-reverse">
        <div class="bg-white/20 w-9 h-9 rounded-xl flex items-center justify-center font-bold text-sm" id="cartCountBadge">0</div>
        <div class="text-left rtl:text-right">
          <div class="text-xs text-rose-100 font-medium" data-i18n="cartTitle">Cart</div>
          <div class="text-sm font-extrabold tracking-tight" id="cartTotalDisplay">0.00 MAD</div>
        </div>
      </div>
      <div class="flex items-center space-x-2 rtl:space-x-reverse text-sm font-bold bg-white/15 px-3.5 py-2 rounded-xl">
        <span data-i18n="commanderBtn">Order</span>
        <i class="fa-solid fa-chevron-right rtl:rotate-180 text-xs"></i>
      </div>
    </button>
  </div>
</div>

<!-- Product modal -->
<div id="productModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="bg-white w-full max-w-md rounded-t-[32px] sm:rounded-[32px] overflow-hidden shadow-2xl max-h-[90vh] flex flex-col">
    <div class="relative h-60 bg-slate-200 flex-shrink-0">
      <img id="modalImage" class="w-full h-full object-cover" alt="">
      <button onclick="closeModal('productModal')" class="absolute top-4 right-4 rtl:right-auto rtl:left-4 w-9 h-9 bg-slate-900/60 hover:bg-slate-900 text-white rounded-full flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
      <div id="modalTag" class="absolute bottom-4 left-4 rtl:left-auto rtl:right-4 bg-amber-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow" data-i18n="popularTag"></div>
    </div>
    <div class="p-5 overflow-y-auto space-y-4 flex-1">
      <div class="flex justify-between items-start gap-3">
        <div>
          <h3 id="modalTitle" class="text-xl font-bold text-slate-900">--</h3>
          <p id="modalCategory" class="text-xs text-slate-500 uppercase tracking-wider font-semibold"></p>
        </div>
        <div id="modalPrice" class="text-end flex flex-col items-end"></div>
      </div>
      <p id="modalDescription" class="text-sm text-slate-600 leading-relaxed"></p>
      <div id="modalIngredientsBlock" class="border-t border-slate-100 pt-3">
        <h4 class="text-xs font-bold text-slate-800 uppercase tracking-wider mb-2" data-i18n="ingredientsTitle"></h4>
        <div id="modalIngredients" class="flex flex-wrap gap-1.5"></div>
      </div>
      <div id="modalQtyRow" class="flex items-center justify-between border-t border-slate-100 pt-4">
        <span class="text-sm font-bold text-slate-800" data-i18n="selectQty"></span>
        <div class="flex items-center space-x-3 rtl:space-x-reverse bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
          <button onclick="adjustModalQty(-1)" class="w-8 h-8 rounded-xl bg-white text-slate-800 shadow-sm flex items-center justify-center"><i class="fa-solid fa-minus text-xs"></i></button>
          <span id="modalQtyDisplay" class="font-bold text-slate-900 w-6 text-center text-sm">1</span>
          <button onclick="adjustModalQty(1)" class="w-8 h-8 rounded-xl bg-brand-600 text-white shadow-sm flex items-center justify-center"><i class="fa-solid fa-plus text-xs"></i></button>
        </div>
      </div>
    </div>
    <div id="modalFooter" class="p-4 bg-slate-50 border-t border-slate-100 flex-shrink-0">
      <button onclick="addModalItemToCart()" class="w-full bg-brand-600 hover:bg-brand-700 text-white py-3.5 rounded-2xl font-bold text-sm shadow-lg transition flex items-center justify-center space-x-2 rtl:space-x-reverse">
        <i class="fa-solid fa-cart-plus"></i>
        <span><span data-i18n="addToOrder"></span> • <span id="modalBtnTotalPrice">0.00 MAD</span></span>
      </button>
    </div>
  </div>
</div>

<!-- Cart modal -->
<div id="cartModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="bg-white w-full max-w-md rounded-t-[32px] sm:rounded-[32px] overflow-hidden shadow-2xl max-h-[90vh] flex flex-col">
    <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
      <div class="flex items-center space-x-2 rtl:space-x-reverse"><i class="fa-solid fa-receipt text-amber-400"></i><h3 class="font-bold text-base" data-i18n="orderSummary"></h3></div>
      <button onclick="closeModal('cartModal')" class="w-8 h-8 bg-slate-800 hover:bg-slate-700 rounded-full flex items-center justify-center text-slate-300"><i class="fa-solid fa-xmark text-sm"></i></button>
    </div>
    <div class="p-4 overflow-y-auto space-y-4 flex-1">
      <div class="bg-amber-50 rounded-2xl p-3 border border-amber-200/80 flex items-center justify-between gap-3">
        <div>
          <div class="text-xs font-bold text-amber-900" data-i18n="selectedTable"></div>
          <div id="qrSubText" class="hidden text-xs text-amber-700" data-i18n="qrSub"></div>
        </div>
        <div id="tableFixedBox" class="hidden flex items-center gap-1.5 bg-white border border-amber-300 rounded-xl px-3 py-1">
          <i class="fa-solid fa-lock text-[10px] text-amber-600"></i>
          <span class="text-xs font-bold text-slate-600" data-i18n="tableLabel"></span>
          <span id="cartTableFixed" class="font-extrabold text-slate-900 text-sm"></span>
        </div>
        <div id="tableSelectBox" class="hidden flex items-center space-x-1 rtl:space-x-reverse">
          <span class="text-xs font-bold text-slate-600" data-i18n="tableLabel"></span>
          <select id="cartTableSelect" onchange="updateTableNumber(this.value)" class="bg-white font-bold text-slate-900 border border-amber-300 rounded-xl px-2 py-1 text-sm focus:outline-none"></select>
        </div>
      </div>
      <div id="cartItemsList" class="space-y-3 divide-y divide-slate-100"></div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
          <i class="fa-regular fa-comment-dots mr-1 rtl:mr-0 rtl:ml-1"></i><span data-i18n="notesLabel"></span>
        </label>
        <textarea id="orderNotesInput" rows="2" maxlength="300" data-i18n-ph="notesPlaceholder" class="w-full text-xs p-3 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-brand-500 focus:outline-none bg-slate-50"></textarea>
      </div>
      <div class="bg-slate-50 p-3.5 rounded-2xl space-y-2 text-xs border border-slate-200/60">
        <div class="flex justify-between text-slate-600"><span data-i18n="subtotal"></span><span id="cartSubtotal" class="font-semibold">0.00 MAD</span></div>
        <div class="flex justify-between text-slate-600"><span data-i18n="vat"></span><span id="cartTax" class="font-semibold">0.00 MAD</span></div>
        <div class="border-t border-slate-200 pt-2 flex justify-between text-sm font-extrabold text-slate-900"><span data-i18n="totalPayable"></span><span id="cartGrandTotal" class="text-brand-600">0.00 MAD</span></div>
      </div>
    </div>
    <div class="p-4 bg-white border-t border-slate-100 flex-shrink-0">
      <button id="sendOrderBtn" onclick="submitOrderToFirebase()" class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-60 disabled:cursor-not-allowed text-white py-3.5 rounded-2xl font-bold text-sm shadow-lg transition flex items-center justify-center space-x-2 rtl:space-x-reverse">
        <i class="fa-solid fa-paper-plane"></i><span data-i18n="sendOrderBtn"></span>
      </button>
    </div>
  </div>
</div>

<!-- Order status / tracking modal -->
<div id="orderStatusModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-sm rounded-[32px] shadow-2xl p-6 text-center space-y-5">
    <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto text-2xl shadow-inner">
      <i id="statusTrackerMainIcon" class="fa-solid fa-paper-plane"></i>
    </div>
    <div>
      <span class="text-xs font-bold uppercase tracking-widest text-slate-400"><span data-i18n="liveStatus"></span> • <span data-i18n="tableLabel"></span> <span id="statusModalTable">--</span></span>
      <h3 id="statusModalTitle" class="text-xl font-extrabold text-slate-900 mt-1">--</h3>
      <p id="statusModalSubtext" class="text-xs text-slate-500 mt-1"></p>
    </div>
    <button onclick="closeModal('orderStatusModal')" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold text-xs hover:bg-slate-800 transition" data-i18n="closeReturn"></button>
  </div>
</div>

<script type="module">
/* =====================================================================
   index.html — public menu.
   Subscription: restaurants/{id}/active (boolean) is the single source of truth.
   active !== true  => menu stays browsable, NEW orders are blocked (client + DB rules),
                       but live tracking of existing orders keeps working.
   Order tracking: saved order id (localStorage) or ?order={orderId} in the URL.
   ===================================================================== */
let restaurant = { name: "", logo: "", logoIcon: "fa-utensils", tables: [] };

const urlParams = new URLSearchParams(window.location.search);
const RID = (urlParams.get('resto') || urlParams.get('restaurant_id') || '').trim().replace(/[.#$\[\]\/]/g, '_');
const rawTableParam = urlParams.get('table');
const TABLE_PARAM = /^[A-Za-z0-9_-]{1,10}$/.test((rawTableParam || '').trim()) ? rawTableParam.trim() : '';
const tableInvalid = rawTableParam !== null && rawTableParam.trim() !== '' && !TABLE_PARAM;
const tableLocked = !!TABLE_PARAM;
const ORDER_PARAM = /^[-\w]{10,40}$/.test((urlParams.get('order') || '').trim()) ? urlParams.get('order').trim() : '';

let promo = null;
let menuCategories = [];
let menuProducts = [];

const L = v => (v && typeof v === 'object') ? v : { fr: v || '', ar: v || '' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const normalizePromo = p => ({ tag: L(p.tag), title: L(p.title), description: L(p.description), image: p.image || '' });
function normalizeProduct(key, p) {
  return { ingredients: [], popular: false, soldOut: false, ...p, id: key, price: Number(p.price) || 0,
           oldPrice: p.oldPrice ? Number(p.oldPrice) : null, name: L(p.name), description: L(p.description),
           image: p.image || '' };
}
function normalizeCategory(c) { return { ...c, label: L(c.label), icon: c.icon || 'fa-tag' }; }

function applyStoreData(data = {}) {
  if (halted) return;
  if (data.restaurant) restaurant = { ...restaurant, ...data.restaurant };
  if ('promo' in data) promo = data.promo ? normalizePromo(data.promo) : null;
  if ('categories' in data) {
    menuCategories = data.categories
      ? Object.values(data.categories).filter(c => c && c.id && !['all', 'popular'].includes(c.id)).map(normalizeCategory)
      : [];
  }
  if ('products' in data) {
    menuProducts = data.products
      ? Object.entries(data.products).filter(([, p]) => p && typeof p === 'object').map(([k, p]) => normalizeProduct(k, p))
      : [];
  }
  renderAll();
}
const configToData = c => ({ restaurant: c && c.restaurant, promo: (c && c.promo) || null, categories: (c && c.categories) || null });

const translations = {
  fr: {
    tableLabel: "Table", searchPlaceholder: "Rechercher des plats, boissons...", activeOrder: "Commande active", viewBtn: "Voir",
    cartTitle: "Mon Panier", commanderBtn: "Commander", popularTag: "Populaire", ingredientsTitle: "Ingrédients clés",
    selectQty: "Quantité", addToOrder: "Ajouter au panier", addBtn: "Ajouter", orderSummary: "Récapitulatif de commande",
    selectedTable: "Table sélectionnée", qrSub: "Scanné via Code QR", notesLabel: "Instructions spéciales",
    notesPlaceholder: "ex: Sans oignons, très épicé...", subtotal: "Sous-total", vat: "Service & TVA (10%)",
    totalPayable: "Total à payer", sendOrderBtn: "Envoyer la commande", liveStatus: "Statut en direct",
    closeReturn: "Fermer & Retour au menu", soldOut: "Épuisé", unavailable: "Indisponible",
    noResults: "Aucun plat trouvé", cartEmpty: "Panier vide", offline: "Connexion indisponible",
    chooseTable: "Choisissez votre table", allDishes: "Tous les plats",
    closedTitle: "Restaurant actuellement fermé aux commandes",
    closedMsg: "Ce restaurant n'accepte pas de nouvelles commandes pour le moment. Vous pouvez consulter le menu et suivre vos commandes déjà passées.",
    closedAlert: "Le restaurant n'accepte pas de nouvelles commandes pour le moment.",
    restoNotFound: "Restaurant introuvable. Veuillez scanner à nouveau le code QR de votre table.",
    invalidQr: "Code QR invalide. Veuillez scanner à nouveau le code QR de votre table.",
    loadError: "Impossible de charger le restaurant. Réessayez."
  },
  ar: {
    tableLabel: "مائدة", searchPlaceholder: "بحث عن أطباق، مشروبات...", activeOrder: "طلب نشط", viewBtn: "عرض",
    cartTitle: "سلة المشتريات", commanderBtn: "إتمام الطلب", popularTag: "الأكثر طلباً", ingredientsTitle: "المكونات الأساسية",
    selectQty: "حدد الكمية", addToOrder: "إضافة للطلب", addBtn: "إضافة", orderSummary: "ملخص الطلب",
    selectedTable: "المائدة المحددة", qrSub: "تمت القراءة عبر QR", notesLabel: "ملاحظات خاصة للمطبخ",
    notesPlaceholder: "مثلاً: بدون بصل، حار جداً...", subtotal: "المجموع الفرعي", vat: "الخدمة والضريبة (10%)",
    totalPayable: "المجموع الكلي", sendOrderBtn: "إرسال الطلب للنادل", liveStatus: "الحالة الحالية",
    closeReturn: "إغلاق والرجوع للمينيو", soldOut: "نفذت الكمية", unavailable: "غير متوفر",
    noResults: "لم يتم العثور على أطباق", cartEmpty: "السلة فارغة", offline: "الاتصال غير متوفر",
    chooseTable: "اختر مائدتك", allDishes: "جميع الأطباق",
    closedTitle: "المطعم لا يستقبل الطلبات حالياً",

function hideLoader() {

function startLiveListeners() {
  const watch = (path, cb) => liveUnsubs.push(onValue(tenantRef(path), snap => {
    if (!halted) cb(snap.exists() ? snap.val() : null);
  }, err => console.error(err)));

  watch('config', v => applyStoreData(configToData(v)));
  watch('menu', v => applyStoreData({ products: v || {} }));
  watch('name', v => { if (v === null) return showFatal('restoNotFound'); restaurant.name = String(v); renderBrand(); });
  watch('logo', v => { restaurant.logo = v ? String(v) : ''; renderBrand(); });
  watch('tablesCount', setTables);
  watch('active', v => setOrdersOpen(v === true));
}

async function initFirebase() {
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
    const lib = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js");
    ({ ref, set, push, onValue, get } = lib);
    db = lib.getDatabase(initializeApp(firebaseConfig));

    const read = async p => { const s = await get(tenantRef(p)); return s.exists() ? s.val() : null; };
    const [name, logo, tablesCount, config, menu, active] = await Promise.all([
      read('name'), read('logo'), read('tablesCount'), read('config'), read('menu'), read('active')
    ]);

    if (name === null) return showFatal('restoNotFound');

    restaurant.name = String(name);
    restaurant.logo = logo ? String(logo) : '';
    setTables(tablesCount);
    if (restaurant.logo) await preloadImage(restaurant.logo);

    dataReady = true;
    ordersOpen = active === true;
    applyStoreData({ ...configToData(config), products: menu || {} });

    // Tracking works whether or not the restaurant is open: saved order on this device, or ?order=ID
    let saved = null;
    try { saved = localStorage.getItem(ORDER_KEY); } catch (e) {}
    if (ORDER_PARAM) { trackOrder(ORDER_PARAM, true); openOrderStatusModal(); }
    else if (saved) trackOrder(saved, false);

    hideLoader();
    startLiveListeners();
  } catch (err) {
    console.error('Firebase failed to load:', err);
    showFatal('loadError');
  }
}

function initChipScroller() {
  const el = $('categoryChips');
  let down = false, moved = false, startX = 0, startLeft = 0;
  el.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      el.scrollLeft += e.deltaY * (document.documentElement.dir === 'rtl' ? -1 : 1);
      e.preventDefault();
    }
  }, { passive: false });
  el.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse') return;
    down = true; moved = false; startX = e.clientX; startLeft = el.scrollLeft;
  });
  window.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 5) { moved = true; el.classList.add('dragging'); }
    el.scrollLeft = startLeft - dx;
  });
  window.addEventListener('pointerup', () => { down = false; el.classList.remove('dragging'); });
  el.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
}

function getCartItemQuantity(id) { const f = cart.find(i => i.id === id); return f ? f.quantity : 0; }

function updateCartQty(productId, delta) {
  if (halted || !ordersOpen) return;
  const p = menuProducts.find(x => x.id === productId);
  if (!p || p.soldOut) return;
  const idx = cart.findIndex(i => i.id === productId);
  if (idx > -1) { cart[idx].quantity += delta; if (cart[idx].quantity <= 0) cart.splice(idx, 1); }
  else if (delta > 0) cart.push({ id: p.id, quantity: delta });
  renderMenuItems(); updateCartBarDisplay(); renderCartModalItems();
}

function cartLines() {
  return cart.map(c => ({ ...menuProducts.find(p => p.id === c.id), quantity: c.quantity })).filter(l => l.id);
}
const cartSubtotal = () => cartLines().reduce((s, l) => s + l.price * l.quantity, 0);

function updateCartBarDisplay() {

/* ---------- Submit (blocked when closed) + live tracking (always available) ---------- */
async function submitOrderToFirebase() {
  if (halted || !cart.length) return;
  const t = translations[currentLang];
  if (!ordersOpen) { alert(t.closedAlert); return; }
  if (!db) { alert(t.offline); return; }

  const table = tableLocked ? TABLE_PARAM : currentSelectedTable;
  if (!table) { alert(t.chooseTable); return; }

  const btn = $('sendOrderBtn');
  btn.disabled = true;
  try {
    // Fresh server-side check right before writing (the database rules enforce it too)
    const s = await get(tenantRef('active'));
    if (s.val() !== true) { setOrdersOpen(false); alert(t.closedAlert); return; }

    const lines = cartLines(), sub = cartSubtotal();
    const payload = {
      tableNumber: table,
      items: lines.map(l => ({ id: l.id, quantity: l.quantity, price: l.price, name: l.name.fr })),
      notes: $('orderNotesInput').value.trim().slice(0, 300),
      subtotal: sub,
      totalAmount: sub * 1.10,
      status: 'pending',
      timestamp: Date.now()
    };
    const orderRef = push(tenantRef('orders'));
    await set(orderRef, payload);

    cart = [];
    $('orderNotesInput').value = '';
    try { localStorage.setItem(ORDER_KEY, orderRef.key); } catch (e) {}
    updateCartBarDisplay(); renderMenuItems(); closeModal('cartModal');
    trackOrder(orderRef.key, false);
    openOrderStatusModal();
  } catch (err) {
    console.error(err);
    // A rules rejection while the restaurant just got suspended looks like permission_denied
    if (/permission[_ ]denied/i.test(String((err && (err.code || err.message)) || ''))) {
      setOrdersOpen(false);
      alert(t.closedAlert);
    } else {
      alert(t.offline);
    }
  } finally {
    btn.disabled = false;
  }
}

function trackOrder(orderId, fromUrl) {
  if (typeof unsubscribeOrder === 'function') unsubscribeOrder();
  activeStatus = 'pending';
  renderOrderStatus();
  unsubscribeOrder = onValue(tenantRef(`orders/${orderId}`), snap => {
    if (!snap.exists()) {
      try { localStorage.removeItem(ORDER_KEY); } catch (e) {}
      activeStatus = fromUrl ? 'NOTFOUND' : null;
    } else {
      const o = snap.val() || {};
      activeStatus = o.status;
      if (fromUrl) { try { localStorage.setItem(ORDER_KEY, orderId); } catch (e) {} }
    }
    renderOrderStatus();
  }, err => { console.error(err); activeStatus = fromUrl ? 'NOTFOUND' : null; renderOrderStatus(); });
}

function renderOrderStatus() {
  const banner = $('activeOrderBanner');
  const info = !halted && activeStatus && (orderStatuses[String(activeStatus).toUpperCase()] || orderStatuses.SENT);
  banner.classList.toggle('hidden', !info);
  if (!info) { closeModal('orderStatusModal'); return; }
  const [title, sub] = info[currentLang];
  $('statusTrackerMainIcon').className = `fa-solid ${info.icon}`;
  $('bannerStatusIcon').className = `fa-solid ${info.icon}`;
  $('statusModalTitle').textContent = title;
  $('statusModalSubtext').textContent = sub;
  $('activeOrderStatusText').textContent = title;
}

function openOrderStatusModal() { if (!halted) $('orderStatusModal').classList.remove('hidden'); }
function closeModal(id) { $(id).classList.add('hidden'); }

Object.assign(window, {
  toggleLanguage, selectCategory, filterMenu, clearSearch, updateCartQty, openProductModal, adjustModalQty,
  addModalItemToCart, openCartModal, updateTableNumber, submitOrderToFirebase, openOrderStatusModal, closeModal
});
</script>
